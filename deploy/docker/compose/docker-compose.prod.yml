services:

  directorysync:

    image: ${DIRECTORYSYNC_IMAGE:-multifactor/directorysync:latest}

    container_name: directorysync

    env_file:
      - ../env/.env.prod

    restart: unless-stopped

    stop_grace_period: 90s

    ports:
      - "8080:8080"

    read_only: true

    tmpfs:
      - /tmp:size=64m,mode=1777

    volumes:
      - directorysync-data:/app/data
      - directorysync-logs:/app/logs
      - ../../../certs:/certs:ro

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

    healthcheck:
      test: ["CMD", "/app/healthcheck.sh"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:

  directorysync-data:
    name: directorysync-data

  directorysync-logs:
    name: directorysync-logs
